plugins {
    id 'com.android.application'
}

android {
    namespace 'com.leafora.nursery'
    compileSdk 35

    defaultConfig {
        applicationId 'com.leafora.nursery'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
    }
}

dependencies {
    implementation 'androidx.core:core:1.15.0'
    implementation 'androidx.webkit:webkit:1.17.1'
}
